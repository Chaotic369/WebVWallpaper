name: WebVWallpaper

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "WebVWallpaper"
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Patch app name and version
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'WebVWallpaper' }}
          APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, sys

          name = os.environ["APP_NAME"]
          version = os.environ["APP_VERSION"]

          # versionCode derived from semver (major*10000 + minor*100 + patch), fallback to run number
          m = re.match(r"^(\d+)\.(\d+)\.(\d+)", version)
          if m:
              code = int(m.group(1)) * 10000 + int(m.group(2)) * 100 + int(m.group(3))
          else:
              code = int(os.environ["RUN_NUMBER"])
          code = max(code, 1)

          # --- AndroidManifest.xml: android:label on <application> ---
          manifest = "app/src/main/AndroidManifest.xml"
          with open(manifest, "r", encoding="utf-8") as f:
              s = f.read()
          esc = name.replace("&", "&amp;").replace('"', "&quot;").replace("<", "&lt;").replace(">", "&gt;")
          app_tag = re.search(r"<application\b[^>]*>", s, re.S)
          if not app_tag:
              sys.exit("No <application> tag found in manifest")
          tag = app_tag.group(0)
          if "android:label=" in tag:
              new_tag = re.sub(r'android:label="[^"]*"', 'android:label="%s"' % esc, tag, count=1)
          else:
              new_tag = tag.replace("<application", '<application android:label="%s"' % esc, 1)
          s = s.replace(tag, new_tag, 1)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(s)

          # --- app/build.gradle.kts (falls back to app/build.gradle) ---
          gradle = "app/build.gradle.kts"
          if not os.path.exists(gradle):
              gradle = "app/build.gradle"
          with open(gradle, "r", encoding="utf-8") as f:
              g = f.read()
          g, n1 = re.subn(r"versionName\s*=?\s*[\"'][^\"']*[\"']", 'versionName = "%s"' % version, g, count=1)
          g, n2 = re.subn(r"versionCode\s*=?\s*\d+", "versionCode = %d" % code, g, count=1)
          if n1 == 0 or n2 == 0:
              sys.exit("Could not patch versionName/versionCode in " + gradle)
          with open(gradle, "w", encoding="utf-8") as f:
              f.write(g)

          print("Patched name=%s version=%s code=%d in %s" % (name, version, code, gradle))
          PY

      - name: Inject icon (if build-icon.png exists)
        run: |
          if [ -f build-icon.png ]; then
            pip install --quiet pillow
            python3 - <<'PY'
          import os, shutil
          from PIL import Image

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = "app/src/main/res"
          src = Image.open("build-icon.png").convert("RGBA")

          # Adaptive icon XML would override the PNGs on API 26+, so remove it
          for fn in ("ic_launcher.xml", "ic_launcher_round.xml"):
              p = os.path.join(res, "mipmap-anydpi-v26", fn)
              if os.path.exists(p):
                  os.remove(p)
          d = os.path.join(res, "mipmap-anydpi-v26")
          if os.path.isdir(d) and not os.listdir(d):
              shutil.rmtree(d)

          for density, px in sizes.items():
              out = os.path.join(res, "mipmap-" + density)
              os.makedirs(out, exist_ok=True)
              img = src.resize((px, px), Image.LANCZOS)
              img.save(os.path.join(out, "ic_launcher.png"))
              img.save(os.path.join(out, "ic_launcher_round.png"))
          print("Icon injected into mipmap-* densities")
          PY
          else
            echo "build-icon.png not found, keeping default icon"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'WebVWallpaper' }}
          path: app/build/outputs/apk/debug/app-debug.apk